name: Build APK Directly
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Zip
        run: |
          unzip -o XAutoFollow.zip
          if [ -d "X-Auto-Follow" ]; then cp -rf X-Auto-Follow/. . && rm -rf X-Auto-Follow; fi
          if [ -d "XAutoFollow" ]; then cp -rf XAutoFollow/. . && rm -rf XAutoFollow; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: x-auto-follow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
