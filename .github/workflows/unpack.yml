name: Unpack Zip
on:
  workflow_dispatch:
  push:
    paths:
      - 'XAutoFollow.zip'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit
        run: |
          unzip -o XAutoFollow.zip
          if [ -d "X-Auto-Follow" ]; then cp -rf X-Auto-Follow/. . && rm -rf X-Auto-Follow; fi
          if [ -d "XAutoFollow" ]; then cp -rf XAutoFollow/. . && rm -rf XAutoFollow; fi
          rm -f XAutoFollow.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack project files"
          git push
